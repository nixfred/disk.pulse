<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="How Disk Pulse works: unprivileged kernel and udisks sources feed a recorder, which writes a private snapshot and a SQLite history the bar widget reads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141d"/>
      <stop offset="1" stop-color="#101c26"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2833" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#43f2a1"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7e959f"/>
    </marker>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#273843"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="22" font-weight="700" letter-spacing="4" fill="#eff7fa">HOW IT WORKS</text>
    <text x="40" y="76" font-size="13" fill="#91a5b0">Every source is readable without root. Nothing leaves the machine. The bar never blocks on storage.</text>

    <!-- Sources column -->
    <text x="40" y="118" font-size="11" letter-spacing="2" fill="#7e959f">SOURCES</text>
    <g fill="#111e28" stroke="#253744">
      <rect x="40" y="130" width="250" height="40" rx="10"/>
      <rect x="40" y="178" width="250" height="40" rx="10"/>
      <rect x="40" y="226" width="250" height="40" rx="10"/>
      <rect x="40" y="274" width="250" height="40" rx="10"/>
      <rect x="40" y="322" width="250" height="40" rx="10"/>
    </g>
    <g font-size="12" fill="#c3d3dc">
      <text x="56" y="149">/proc/self/mountinfo · statvfs</text>
      <text x="56" y="163" font-size="10" fill="#7e959f">every real filesystem, remote ones on a deadline</text>
      <text x="56" y="197">/sys/class/block/*/stat · hwmon</text>
      <text x="56" y="211" font-size="10" fill="#7e959f">read/write rates, busy time, latency, temperature</text>
      <text x="56" y="245">/proc/pressure/io · /proc/&lt;pid&gt;/io</text>
      <text x="56" y="259" font-size="10" fill="#7e959f">I/O pressure and per-process storage traffic</text>
      <text x="56" y="293">udisks2 over D-Bus</text>
      <text x="56" y="307" font-size="10" fill="#7e959f">SMART: wear, spare, lifetime bytes, warnings</text>
      <text x="56" y="341">/sys/fs/btrfs · fstrim.timer</text>
      <text x="56" y="355" font-size="10" fill="#7e959f">allocation, device errors, commits, last trim</text>
    </g>

    <!-- Recorder -->
    <text x="380" y="118" font-size="11" letter-spacing="2" fill="#7e959f">RECORDER · disk-pulse.service</text>
    <rect x="380" y="130" width="250" height="232" rx="14" fill="#0f1c26" stroke="#2c5547"/>
    <g font-size="12" fill="#c3d3dc">
      <text x="398" y="158" font-weight="700" fill="#eff7fa">disk_pulse.py daemon</text>
      <text x="398" y="184">every 3 s   rates, filesystems, pressure</text>
      <text x="398" y="206">every 9 s   disk hogs</text>
      <text x="398" y="228">every 15 s  history sample</text>
      <text x="398" y="250">every 60 s  SMART and trim timer</text>
      <text x="398" y="284" font-size="10" fill="#7e959f">Nice=10 · NoNewPrivileges · UMask=0077</text>
      <text x="398" y="300" font-size="10" fill="#7e959f">a hung share costs one thread, never a sample</text>
      <text x="398" y="316" font-size="10" fill="#7e959f">a counter reset reads as zero, not a spike</text>
      <text x="398" y="342" font-size="10" fill="#7e959f">state 0700 / files 0600 · symlinks refused</text>
    </g>

    <!-- State -->
    <text x="720" y="118" font-size="11" letter-spacing="2" fill="#7e959f">PRIVATE STATE · 0700</text>
    <g fill="#111e28" stroke="#253744">
      <rect x="720" y="130" width="200" height="64" rx="10"/>
      <rect x="720" y="206" width="200" height="64" rx="10"/>
      <rect x="720" y="282" width="200" height="80" rx="10"/>
    </g>
    <g font-size="12" fill="#c3d3dc">
      <text x="736" y="152" font-weight="700" fill="#eff7fa">snapshot.json</text>
      <text x="736" y="168" font-size="10" fill="#7e959f">the latest reading, replaced</text>
      <text x="736" y="182" font-size="10" fill="#7e959f">atomically, never logged</text>
      <text x="736" y="228" font-weight="700" fill="#eff7fa">history.sqlite3</text>
      <text x="736" y="244" font-size="10" fill="#7e959f">7 days · up to 40,320 samples</text>
      <text x="736" y="258" font-size="10" fill="#7e959f">aggregate metrics only</text>
      <text x="736" y="304" font-weight="700" fill="#eff7fa">history.json</text>
      <text x="736" y="320" font-size="10" fill="#7e959f">1 h / 24 h / 7 d, ~240 points</text>
      <text x="736" y="334" font-size="10" fill="#7e959f">each, with per-bucket peaks</text>
      <text x="736" y="348" font-size="10" fill="#7e959f">and boot ids so reboots break traces</text>
    </g>

    <!-- Widget -->
    <text x="1000" y="118" font-size="11" letter-spacing="2" fill="#7e959f">BAR WIDGET</text>
    <rect x="1000" y="130" width="160" height="232" rx="14" fill="#0f1c26" stroke="#2c5547"/>
    <g font-size="12" fill="#c3d3dc">
      <text x="1016" y="158" font-weight="700" fill="#eff7fa">Panel.qml</text>
      <text x="1016" y="180">watches both files</text>
      <text x="1016" y="202">paints the die</text>
      <text x="1016" y="224">four tabs</text>
      <text x="1016" y="246">six readouts</text>
      <text x="1016" y="280" font-size="10" fill="#7e959f">colours from the</text>
      <text x="1016" y="294" font-size="10" fill="#7e959f">active Omarchy theme</text>
      <text x="1016" y="316" font-size="10" fill="#7e959f">repaints on a 10 Hz tick,</text>
      <text x="1016" y="330" font-size="10" fill="#7e959f">nothing while closed</text>
    </g>

    <!-- Arrows -->
    <g stroke="#43f2a1" stroke-width="2" fill="none" marker-end="url(#arrow)" filter="url(#softglow)">
      <path d="M290 246 L378 246"/>
      <path d="M630 246 L718 246"/>
      <path d="M920 246 L998 246"/>
    </g>
    <g stroke="#7e959f" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrowDim)">
      <path d="M1080 362 C1080 386, 520 386, 505 366"/>
    </g>
    <text x="700" y="404" font-size="10" fill="#7e959f" text-anchor="middle">~/.local/state/disk-pulse  ·  click-to-focus and flush run the helper as one-shot processes; the daemon is never asked to act</text>
  </g>
</svg>
